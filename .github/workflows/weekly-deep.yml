# Weekly Deep — sanitizers + stress + coverage (scheduled + manual)
#
# Triggers: scheduled weekly on Monday 00:00 UTC, or manual (workflow_dispatch)
# Calls: reusable-sanitizers.yml, reusable-coverage-badge.yml from ai-warevo/.github
#
# This workflow runs the comprehensive test suite:
#   - ASan + UBSan (full test suite in container)
#   - TSan (concurrency tests + 30x stress repeats on host)
#   - Stress (30x concurrency tests in Release optimized builds)
#   - Coverage (gcovr → badge → GitHub Pages)

name: Weekly Deep

on:
  schedule:
    - cron: '0 0 * * 1'  # every Monday at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  sanitizers:
    uses: ai-warevo/.github/.github/workflows/reusable-sanitizers.yml@main
    with:
      source_dir: .
      build_dir: build
      container_image: ghcr.io/ai-warevo/ci-cpp23
      cmake_sanitize_var: AW_TPL_SANITIZE
      cmake_extra_args: ''
      ctest_timeout: 300
      tsan_repeat_count: 30
      tsan_test_regex: 'tobus_concurrency'
      asan_options: 'alloc_dealloc_mismatch=0:detect_leaks=1'
      tsan_options: 'halt_on_error=1:second_deadlock_stack=1'

  stress:
    name: Repeat concurrency tests 30x (${{ matrix.toolchain }}, Release)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ai-warevo/ci-cpp23
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        toolchain: [clang18-libcxx, gcc15]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        id: tc
        uses: ai-warevo/.github/.github/actions/setup-toolchain@main
        with:
          toolchain: ${{ matrix.toolchain }}
          container_mode: true

      - name: Configure & Build
        uses: ai-warevo/.github/.github/actions/cmake-build@main
        with:
          source_dir: .
          build_dir: build
          build_type: Release
          extra_args: ${{ steps.tc.outputs.cmake_args }}

      - name: Run Stress Tests
        uses: ai-warevo/.github/.github/actions/ctest-run@main
        with:
          source_dir: .
          build_dir: build
          config: Release
          output_on_failure: true
          timeout: 300
          ctest_flags: '--repeat 30 -R tobus_concurrency'

  coverage:
    uses: ai-warevo/.github/.github/workflows/reusable-coverage-badge.yml@main
    with:
      source_dir: .
      build_dir: build
      container_image: ghcr.io/ai-warevo/ci-cpp23
      toolchain: gcc15
      cmake_extra_args: '-DAW_TOBUS_BUILD_TESTS=ON -DAW_ENABLE_COVERAGE=ON'
      gcovr_source_filter: ''
      gcovr_exclude: '*/_deps/* examples/*'
