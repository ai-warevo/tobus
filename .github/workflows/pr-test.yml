# PR Test — fast unit tests on every pull request
#
# Triggers: pull_request and push to main/master
# Calls: reusable-matrix.yml from ai-warevo/.github
#
# This workflow runs a fast Debug unit test suite across the primary toolchains
# (clang-18/libc++ and gcc-15) plus Windows MSVC, keeping feedback time to <15 minutes.

name: PR Test

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    uses: ai-warevo/.github/.github/workflows/reusable-matrix.yml@main
    with:
      source_dir: .
      build_dir: build
      enable_windows: true
      cmake_extra_args_linux: >-
        -DTOBUS_WARNINGS_AS_ERRORS=ON
        -DTOBUS_BUILD_EXAMPLES=ON
        -DTOBUS_ENABLE_UNIX_SOCKET=ON
        -DTOBUS_ENABLE_TCP_SERVER=ON
        -DTOBUS_ENABLE_HTTP=ON
        -DTOBUS_ENABLE_WEBSOCKET=ON
        -DTOBUS_ENABLE_REDIS=ON
        -DTOBUS_ENABLE_ZEROMQ=ON
        -DTOBUS_ENABLE_RABBITMQ=ON
        -DTOBUS_ENABLE_KAFKA=ON
      cmake_extra_args_windows: >-
        -DTOBUS_BUILD_EXAMPLES=ON
      ctest_timeout: 120
